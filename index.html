<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tic-Tac-Toe | VOSC Activity 1</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game-container">

        <!-- Heading -->
        <header>
            
            <h1>Tic-Tac-Toe</h1>
            <p class="subtitle">
                Two Player Game
            </p>
        </header>


        <!-- Player Setup -->
        <section class="setup" id="setup">

            <h2>Enter Player Details</h2>

            <div class="player-inputs">

                <div class="input-box">
                    <label for="player1Name">
                        Player 1 Name
                    </label>

                    <input
                        type="text"
                        id="player1Name"
                        placeholder="Enter name"
                    >
                </div>


                <div class="input-box">
                    <label for="player2Name">
                        Player 2 Name
                    </label>

                    <input
                        type="text"
                        id="player2Name"
                        placeholder="Enter name"
                    >
                </div>

            </div>


            <h3>Player 1 - Choose Symbol</h3>

            <div class="symbol-selection">

                <button
                    class="symbol-btn selected"
                    data-symbol="X"
                >
                    X
                </button>

                <button
                    class="symbol-btn"
                    data-symbol="O"
                >
                    O
                </button>

            </div>


            <button
                id="startGameBtn"
                class="start-btn"
            >
                Start Game
            </button>

            <p id="errorMessage"></p>

        </section>


        <!-- Game -->
        <section
            class="game"
            id="game"
            style="display: none;"
        >

            <!-- Scoreboard -->
            <div class="scoreboard">

                <div
                    class="player-card active"
                    id="player1Card"
                >

                    <span id="player1Display">
                        Player 1
                    </span>

                    <strong id="player1Symbol">
                        X
                    </strong>

                    <p>
                        Score:
                        <span id="score1">0</span>
                    </p>

                </div>


                <div
                    class="player-card"
                    id="player2Card"
                >

                    <span id="player2Display">
                        Player 2
                    </span>

                    <strong id="player2Symbol">
                        O
                    </strong>

                    <p>
                        Score:
                        <span id="score2">0</span>
                    </p>

                </div>

            </div>


            <!-- Turn -->
            <div class="status-box">

                <p id="status">
                    Player 1's turn
                </p>

            </div>


            <!-- Board -->
            <div
                class="board"
                id="board"
            >

                <button class="cell" data-index="0"></button>
                <button class="cell" data-index="1"></button>
                <button class="cell" data-index="2"></button>

                <button class="cell" data-index="3"></button>
                <button class="cell" data-index="4"></button>
                <button class="cell" data-index="5"></button>

                <button class="cell" data-index="6"></button>
                <button class="cell" data-index="7"></button>
                <button class="cell" data-index="8"></button>

                <!-- Strike line -->
                <div
                    id="strike"
                    class="strike"
                ></div>

            </div>


            <!-- Result -->
            <div
                id="result"
                class="result"
            ></div>


            <!-- Buttons -->
            <div class="game-buttons">

                <button
                    id="nextRoundBtn"
                    class="primary-btn"
                >
                    Next Round
                </button>

                <button
                    id="resetGameBtn"
                    class="secondary-btn"
                >
                    Reset Game
                </button>

            </div>

        </section>


        <footer>
            Built using HTML • CSS • JavaScript
        </footer>

    </div>


    <script src="script.js"></script>

</body>

</html>
